name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15            # CHANGED (was macos-14), newer image
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select newer Xcode            # NEW
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version            # NEW
        run: xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Show Flutter version          # NEW
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Pre-build iOS Frameworks
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Application (Unsigned)
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r carepulse.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: carepulse-ipa
          path: build/ios/iphoneos/carepulse.ipa